<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2747">
<title>Escandallo Desayunos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--navy:#0f2747;--navy2:#1d3d6b;--gold:#b8934f;--bg:#f2f4f7;--card:#fff;--tx:#17202e;--mut:#6b7686;--ok:#1b8a4b;--warn:#c27a00;--bad:#c62828;--line:#e1e5eb;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
#app{min-height:100vh;padding-bottom:78px}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 12px calc(8px);box-shadow:0 2px 8px #0003}
.hrow{display:flex;align-items:center;gap:8px}
.brand{font-weight:700;letter-spacing:.2px;flex:1;font-size:17px}
.brand small{display:block;font-weight:400;opacity:.7;font-size:11px}
.pill{background:#ffffff1f;border-radius:99px;padding:5px 10px;font-size:13px;white-space:nowrap}
.pill.cerrado{background:var(--gold);color:#fff}
.pill.demo{background:#c62828}
input.date{background:#ffffff1f;border:0;color:#fff;border-radius:10px;padding:6px 8px;font-size:14px;color-scheme:dark}
.search{width:100%;margin-top:8px;padding:12px 14px;border-radius:12px;border:0;font-size:17px;background:#fff;color:var(--tx)}
main{padding:12px;max-width:980px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0001}
.item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border-radius:12px;margin-bottom:7px;border:1px solid var(--line);width:100%;text-align:left}
.item .n{flex:1;min-width:0}
.item .n b{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.item .n span{font-size:12px;color:var(--mut)}
.tag{font-size:12px;border-radius:8px;padding:3px 7px;background:#e8eef7;color:var(--navy);white-space:nowrap}
.tag.g{background:#e3f4ea;color:var(--ok)} .tag.w{background:#fff1d6;color:var(--warn)} .tag.r{background:#fde6e6;color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
nav.bot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:25;padding-bottom:env(safe-area-inset-bottom)}
nav.bot button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:11.5px;color:var(--mut)}
nav.bot button.on{color:var(--navy);font-weight:700}
nav.bot button i{display:block;font-style:normal;font-size:20px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;background:var(--navy);color:#fff;font-size:16px}
.btn.gold{background:var(--gold)} .btn.ghost{background:#e8eef7;color:var(--navy)} .btn.bad{background:var(--bad)} .btn.sm{padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center} .grow{flex:1}
label.f{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input.in,select.in{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:17px;background:#fff}
input.in:focus{outline:none;border-color:var(--navy2)}
.seg{display:flex;background:#e8eef7;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:11px;border-radius:10px;font-weight:600;color:var(--navy)}
.seg button.on{background:var(--navy);color:#fff}
.sheet-bg{position:fixed;inset:0;background:#0007;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 2px}
.muted{color:var(--mut);font-size:13px}
.big{font-size:26px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:#fff;border-radius:var(--r);padding:12px;box-shadow:0 1px 3px #0001}
.kpi b{display:block;font-size:22px} .kpi span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px} th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right} th:first-child,td:first-child{text-align:left} th{font-size:12px;color:var(--mut);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:#17202e;color:#fff;padding:11px 16px;border-radius:12px;z-index:60;max-width:92%;font-size:14px}
.toast.bad{background:var(--bad)}
.banner{background:#fff6e0;border:1px solid #f0d58c;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.login{max-width:380px;margin:12vh auto 0;padding:0 18px}
.login h1{color:var(--navy);margin:0 0 4px}
.qtyin{font-size:34px;text-align:center;font-weight:700}
.mv{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mv.an{opacity:.45;text-decoration:line-through}
.bar{height:8px;background:#e3e8ef;border-radius:8px;overflow:hidden} .bar i{display:block;height:100%;background:var(--ok)}
.hidden{display:none!important}
.cl{border-left:4px solid var(--line)} .cl.ok{border-left-color:var(--ok)} .cl.pend{border-left-color:var(--warn)}
@media(min-width:760px){nav.bot{max-width:560px;left:50%;transform:translateX(-50%);border-radius:16px 16px 0 0;border:1px solid var(--line)}}
</style>

<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
const CATALOGO = [];
/* ============================================================
   UTILIDADES
============================================================ */
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nid=()=>(crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random().toString(16).slice(2));
const isoDate=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const today=()=>isoDate(new Date());
const nf=(n,d=2)=>new Intl.NumberFormat('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d}).format(+n||0);
const q3=n=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:3}).format(+n||0);
const eur=n=>nf(n,2)+' €';
const parseNum=s=>{if(typeof s==='number')return s;s=String(s||'').trim().replace(/\s/g,'');if(!s)return NaN;if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'');return parseFloat(s.replace(',','.'));};
const fechaLarga=f=>new Date(f+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short',day:'2-digit',month:'short'});
const round=(n,d=4)=>Math.round(n*10**d)/10**d;
const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
function toast(msg,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),bad?4500:2200);}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error('No se pudo cargar el módulo Excel (¿sin conexión?)'));document.head.appendChild(s);});}
const cu=p=>p?(+p.precio_compra||0)/((+p.factor)||1):0;
const UN={BTL:['botella','botellas'],KG:['kilo','kilos'],LTR:['litro','litros'],L:['litro','litros'],UT:['unidad','unidades'],EA:['unidad','unidades'],CS:['caja','cajas'],PK:['pack','packs'],CAN:['bote','botes'],BAG:['bolsa','bolsas'],BKT:['cubo','cubos'],SK:['saco','sacos'],RL:['rollo','rollos'],TRY:['bandeja','bandejas'],DZ:['docena','docenas']};
const ul=u=>{const k=String(u||'').toUpperCase();return esc(UN[k]?UN[k][0]:String(u||'').toLowerCase());};
const ulp=(u,n)=>{const k=String(u||'').toUpperCase();const s=UN[k];return esc(s?(Math.abs(+n)===1?s[0]:s[1]):String(u||'').toLowerCase());};

/* ============================================================
   CAPA DE DATOS  (LocalStore = demo en el navegador · CloudStore = Supabase)
============================================================ */
const LocalStore={
  name:'local',
  db:null,
  _load(){const k='kd_local_v1';let d=localStorage.getItem(k);if(d)this.db=JSON.parse(d);else{this.db={productos:CATALOGO.map(p=>({...p,activo:!!p.activo,nuevo:false})),dias:[],movimientos:[],cierres:[]};this._save();}},
  _save(){localStorage.setItem('kd_local_v1',JSON.stringify(this.db));},
  async login(nombre,pin){this._load();const U={admin:['123456','admin'],cocina:['111111','cocina'],ventas:['222222','ventas']};const u=U[nombre.trim().toLowerCase()];if(!u||u[0]!==pin)throw new Error('Nombre o PIN incorrectos (demo: admin/123456 · cocina/111111 · ventas/222222)');return{nombre:nombre.trim(),rol:u[1]};},
  async getProductos(){return this.db.productos.map(p=>({...p}));},
  async upsertProductos(list,user){for(const p of list){const i=this.db.productos.findIndex(x=>x.codigo===p.codigo);const row={...p,updated_by:user};if(i>=0)this.db.productos[i]={...this.db.productos[i],...row};else this.db.productos.push(row);}this._save();},
  async getDia(f){return{dia:this.db.dias.find(d=>d.fecha===f)||null,movs:this.db.movimientos.filter(m=>m.fecha===f),cierres:this.db.cierres.filter(c=>c.fecha===f)};},
  async getRango(a,b){const ok=f=>f>=a&&f<=b;return{dias:this.db.dias.filter(d=>ok(d.fecha)),movs:this.db.movimientos.filter(m=>ok(m.fecha)),cierres:this.db.cierres.filter(c=>ok(c.fecha))};},
  async getUltimoCerradoAntes(f){const d=this.db.dias.filter(x=>x.estado==='cerrado'&&x.fecha<f).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];if(!d)return null;return{fecha:d.fecha,cierres:this.db.cierres.filter(c=>c.fecha===d.fecha)};},
  _guard(f){const d=this.db.dias.find(x=>x.fecha===f);if(d&&d.estado==='cerrado')throw new Error('El día '+f+' está cerrado');},
  async addMov(m){this._guard(m.fecha);this.db.movimientos.push({...m,anulado:false});this._save();},
  async anularMov(id,user){const m=this.db.movimientos.find(x=>x.id===id);this._guard(m.fecha);m.anulado=true;m.anulado_por=user;this._save();},
  async setPax(f,pax,force){if(!force)this._guard(f);let d=this.db.dias.find(x=>x.fecha===f);if(!d){d={fecha:f,pax:null,estado:'abierto'};this.db.dias.push(d);}d.pax=pax;this._save();},
  async saveCierre(c){this._guard(c.fecha);const i=this.db.cierres.findIndex(x=>x.fecha===c.fecha&&x.codigo===c.codigo);if(i>=0)this.db.cierres[i]=c;else this.db.cierres.push(c);this._save();},
  async cerrarDia(f,user){let d=this.db.dias.find(x=>x.fecha===f);if(!d){d={fecha:f,pax:null,estado:'abierto'};this.db.dias.push(d);}d.estado='cerrado';d.cerrado_por=user;d.cerrado_at=new Date().toISOString();this._save();},
  async reabrirDia(f){const d=this.db.dias.find(x=>x.fecha===f);if(d)d.estado='abierto';this._save();},
  async delDia(f){this.db.movimientos=this.db.movimientos.filter(m=>m.fecha!==f);this.db.cierres=this.db.cierres.filter(c=>c.fecha!==f);this.db.dias=this.db.dias.filter(d=>d.fecha!==f);this._save();},
  async addMovs(l){this.db.movimientos.push(...l);this._save();},
  async saveCierres(l){for(const c of l){const i=this.db.cierres.findIndex(x=>x.fecha===c.fecha&&x.codigo===c.codigo);if(i>=0)this.db.cierres[i]=c;else this.db.cierres.push(c);}this._save();},
  async getAvisos(){return this.db.avisos||[];},
  async setAviso(a){this.db.avisos=(this.db.avisos||[]).filter(x=>!(x.fecha===a.fecha&&x.codigo===a.codigo));this.db.avisos.push(a);this._save();}
};

const CloudStore={
  name:'cloud', tok:null, rtok:null, uid:null,
  url:()=>CFG.SUPABASE_URL.replace(/\/$/,''),
  async _auth(body,grant){const r=await fetch(this.url()+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:CFG.SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Credenciales incorrectas');this.tok=j.access_token;this.rtok=j.refresh_token;this.uid=j.user.id;return j;},
  async _req(method,path,body,extra,retry=true){
    const r=await fetch(this.url()+'/rest/v1/'+path,{method,headers:{apikey:CFG.SUPABASE_KEY,Authorization:'Bearer '+this.tok,'Content-Type':'application/json',Prefer:'return=representation',...(extra||{})},body:body?JSON.stringify(body):undefined});
    if(r.status===401&&retry&&this.rtok){await this._auth({refresh_token:this.rtok},'refresh_token');return this._req(method,path,body,extra,false);}
    const t=await r.text();let j;try{j=t?JSON.parse(t):[]}catch{j=t}
    if(!r.ok)throw new Error((j&&(j.message||j.hint))||('Error '+r.status));
    return j;},
  async login(nombre,pin){const slug=nombre.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');const aj=await this._auth({email:slug+'@klm-desayunos.app',password:pin},'password');this.must=!!(aj.user&&aj.user.user_metadata&&aj.user.user_metadata.must_change_pw);const p=await this._req('GET','perfiles?user_id=eq.'+this.uid+'&select=nombre,rol');if(!p.length)throw new Error('Usuario sin perfil: pídele al admin que lo dé de alta');return{nombre:p[0].nombre,rol:p[0].rol};},
  async changePin(np){const r=await fetch(this.url()+'/auth/v1/user',{method:'PUT',headers:{apikey:CFG.SUPABASE_KEY,Authorization:'Bearer '+this.tok,'Content-Type':'application/json'},body:JSON.stringify({password:np,data:{must_change_pw:false}})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg||j.error_description||'No se pudo cambiar el PIN');this.must=false;}, async getProductos(){const out=[];for(let o=0;;o+=1000){const r=await this._req('GET','productos?select=*&order=descripcion&limit=1000&offset='+o);out.push(...r);if(r.length<1000)break;}return out;},
  async upsertProductos(list,user){const rows=list.map(p=>{const{coste_unitario,...r}=p;return{...r,updated_by:user};});for(let i=0;i<rows.length;i+=200)await this._req('POST','productos?on_conflict=codigo',rows.slice(i,i+200),{Prefer:'resolution=merge-duplicates,return=minimal'});},
  async getDia(f){const[d,m,c]=await Promise.all([this._req('GET','dias?fecha=eq.'+f),this._req('GET','movimientos?fecha=eq.'+f+'&order=ts'),this._req('GET','cierres?fecha=eq.'+f)]);return{dia:d[0]||null,movs:m,cierres:c};},
  async _all(path,order){const out=[];for(let o=0;;o+=1000){const r=await this._req('GET',path+'&order='+order+'&limit=1000&offset='+o);out.push(...r);if(r.length<1000)break;}return out;},
  async getRango(a,b){const q=`fecha=gte.${a}&fecha=lte.${b}`;const[d,m,c]=await Promise.all([this._all('dias?'+q,'fecha'),this._all('movimientos?'+q,'fecha,ts,id'),this._all('cierres?'+q,'fecha,codigo')]);return{dias:d,movs:m,cierres:c};},
  async getUltimoCerradoAntes(f){const d=await this._req('GET','dias?estado=eq.cerrado&fecha=lt.'+f+'&order=fecha.desc&limit=1');if(!d.length)return null;const c=await this._req('GET','cierres?fecha=eq.'+d[0].fecha);return{fecha:d[0].fecha,cierres:c};},
  async addMov(m){await this._req('POST','movimientos',m,{Prefer:'return=minimal'});},
  async anularMov(id,user){await this._req('PATCH','movimientos?id=eq.'+id,{anulado:true,anulado_por:user},{Prefer:'return=minimal'});},
  async setPax(f,pax){await this._req('POST','dias?on_conflict=fecha',{fecha:f,pax},{Prefer:'resolution=merge-duplicates,return=minimal'});},
  async saveCierre(c){await this._req('POST','cierres?on_conflict=fecha,codigo',c,{Prefer:'resolution=merge-duplicates,return=minimal'});},
  async cerrarDia(f,user){await this._req('POST','dias?on_conflict=fecha',{fecha:f,estado:'cerrado',cerrado_por:user,cerrado_at:new Date().toISOString()},{Prefer:'resolution=merge-duplicates,return=minimal'});},
  async reabrirDia(f){await this._req('PATCH','dias?fecha=eq.'+f,{estado:'abierto'},{Prefer:'return=minimal'});},
  async delDia(f){const q='fecha=eq.'+f;await this._req('DELETE','movimientos?'+q,null,{Prefer:'return=minimal'});await this._req('DELETE','cierres?'+q,null,{Prefer:'return=minimal'});await this._req('DELETE','dias?'+q,null,{Prefer:'return=minimal'});},
  async addMovs(l){for(let i=0;i<l.length;i+=500)await this._req('POST','movimientos',l.slice(i,i+500),{Prefer:'return=minimal'});},
  async saveCierres(l){for(let i=0;i<l.length;i+=500)await this._req('POST','cierres?on_conflict=fecha,codigo',l.slice(i,i+500),{Prefer:'resolution=merge-duplicates,return=minimal'});},
  _avL(){try{return JSON.parse(localStorage.getItem('kd_avisos')||'[]');}catch{return[];}},
  async getAvisos(){try{const r=await this._all('avisos?select=*','fecha,codigo');S._avisosLocal=false;return r;}catch(e){S._avisosLocal=true;return this._avL();}},
  async setAviso(a){try{await this._req('POST','avisos?on_conflict=fecha,codigo',a,{Prefer:'resolution=merge-duplicates,return=minimal'});}catch(e){S._avisosLocal=true;const l=this._avL().filter(x=>!(x.fecha===a.fecha&&x.codigo===a.codigo));l.push(a);localStorage.setItem('kd_avisos',JSON.stringify(l));}}
};
const CLOUD=!!(window.CFG&&CFG.SUPABASE_URL&&CFG.SUPABASE_KEY);
const DB=CLOUD?CloudStore:LocalStore;

/* ============================================================
   ESTADO
============================================================ */
const S={user:null,fecha:today(),prods:new Map(),day:{dia:null,movs:[],cierres:[]},prev:null,hist:null,tab:'captura',q:'',cat:'Todas',vista:'usados',draft:{},cierreEdit:{},busy:false,avisos:new Map(),
  an:{desde:null,hasta:null,data:null},ex:{desde:null,hasta:null}};
const ROLES={admin:['captura','cierre','analisis','control','catalogo','exportar'],cocina:['captura','cierre'],chef:['captura','cierre','analisis','control'],lectura:['analisis','control'],ventas:['analisis']};
const isClosed=()=>S.day.dia&&S.day.dia.estado==='cerrado';
const isAdmin=()=>!!(S.user&&S.user.rol==='admin');
const canWrite=()=>S.user&&['admin','cocina','chef'].includes(S.user.rol)&&(!isClosed()||isAdmin());
const prodList=()=>[...S.prods.values()];

/* ---------- cálculo ---------- */
function agg(movs,cierres,prods){
  // devuelve Map codigo -> {E,R,A,M,reut,cu,sacado,consumo,bruto,cierre}
  const m=new Map();
  for(const x of movs){if(x.anulado)continue;let r=m.get(x.codigo);if(!r){r={codigo:x.codigo,E:0,R:0,A:0,M:0,reut:false,cierre:null};m.set(x.codigo,r);}if(x.tipo==='expuesto')r.E+=+x.cantidad;else r.R+=+x.cantidad;}
  for(const c of cierres){let r=m.get(c.codigo);if(!r){r={codigo:c.codigo,E:0,R:0,A:0,M:0,reut:false,cierre:null};m.set(c.codigo,r);}r.A=+c.aprovechamiento||0;r.M=+c.merma||0;r.reut=!!c.reutiliza;r.cierre=c;}
  for(const r of m.values()){const p=prods.get(r.codigo);r.p=p;r.cu=(r.cierre&&r.cierre.coste_unit!=null)?+r.cierre.coste_unit:cu(p);r.E=round(r.E);r.R=round(r.R);r.sacado=round(r.E+r.R);r.consumo=round(r.E+r.R-r.A-r.M);r.bruto=round(r.E+r.R-r.A);}
  return m;
}
function totales(map){let c=0,mer=0,br=0;for(const r of map.values()){c+=r.consumo*r.cu;mer+=r.M*r.cu;br+=r.bruto*r.cu;}return{consumo:c,merma:mer,bruto:br};}

/* ============================================================
   CARGA
============================================================ */
async function boot(){
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  const s=sessionStorage.getItem('kd_user');

/* ---------- CAPTURA ---------- */
function visibles(){
  const q=S.q.trim().toLowerCase();const used=agg(S.day.movs,S.day.cierres,S.prods);
  let l=prodList().filter(p=>p.activo!==false);
  if(q)l=l.filter(p=>(p.descripcion+' '+p.codigo+' '+(p.categoria||'')).toLowerCase().includes(q));
  else if(S.vista==='usados')l=l.filter(p=>used.has(p.codigo)&&used.get(p.codigo).sacado>0);
  else if(S.vista==='frecuentes'){const f=frecuentes();l=l.filter(p=>f.has(p.codigo));}
  if(S.cat!=='Todas'&&!q)l=l.filter(p=>p.categoria===S.cat);
  l.sort((a,b)=>a.descripcion.localeCompare(b.descripcion,'es'));
  return{l,used};
}
function frecuentes(){const c=new Map();if(S.hist)for(const m of S.hist.movs){if(!m.anulado)c.set(m.codigo,(c.get(m.codigo)||new Set()).add(m.fecha));}const out=new Set();for(const[k,v]of c)if(v.size>=2)out.add(k);return out;}
function vCaptura(){
  const{l,used}=visibles();const cats=['Todas',...new Set(prodList().map(p=>p.categoria||'Otros'))].sort((a,b)=>a==='Todas'?-1:b==='Todas'?1:a.localeCompare(b,'es'));
  let ban='';
  const hasArr=S.day.movs.some(m=>m.origen==='arrastre'&&!m.anulado);
  if(canWrite()&&S.prev&&!hasArr){const n=S.prev.cierres.filter(c=>c.reutiliza&&+c.aprovechamiento>0);if(n.length)ban=`<div class="banner">🔁 Ayer (${fechaLarga(S.prev.fecha)}) quedaron <b>${n.length}</b> artículos para reutilizar. <button class="btn gold sm" data-act="arrastre" style="margin-left:6px">Cargar sobrantes de ayer</button></div>`;}
  if(S.day.dia==null||S.day.dia.pax==null)ban+=`<div class="banner">⚠️ Falta indicar los <b>PAX</b> del día (se necesitan para cerrar).</div>`;
  const q=S.q.trim();
  return `${ban}${canWrite()?'<button class="btn gold sm" data-act="nuevo" style="width:100%;margin-bottom:8px">➕ Artículo nuevo (no está en el catálogo)</button>':''}<div class="seg" style="margin-bottom:8px">${[['usados','Usados hoy'],['frecuentes','Frecuentes'],['todos','Todos']].map(([k,t])=>`<button class="${S.vista===k?'on':''}" data-act="vista" data-v="${k}">${t}</button>`).join('')}</div>
  <div class="chips">${cats.map(c=>`<button class="chip ${S.cat===c?'on':''}" data-act="cat" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  ${l.length?l.slice(0,300).map(p=>{const r=used.get(p.codigo);return `<button class="item" data-act="open" data-c="${esc(p.codigo)}"><div class="n"><b>${esc(p.descripcion)}</b><span>${esc(p.categoria||'')} · ${eur(cu(p))}/${ul(p.unidad_conteo)}${p.nuevo?' · <b style="color:#c27a00">NUEVO</b>':''}</span></div>${r&&r.sacado>0?`<span class="tag g">${q3(r.sacado)} ${ulp(p.unidad_conteo,r.sacado)}</span>`:`<span class="tag">+</span>`}</button>`}).join(''):`<div class="card muted">${S.vista==='usados'&&!q?'Aún no hay cantidades hoy. Busca un artículo arriba o cambia a «Todos».':'Sin resultados.'}</div>`}
  ${l.length>300?'<div class="muted">Mostrando 300: afina la búsqueda.</div>':''}
  ${canWrite()&&q?`<button class="item" data-act="nuevo" style="border-style:dashed"><div class="n"><b>➕ Crear artículo nuevo «${esc(q)}»</b><span>Si no está en el catálogo: nombre, unidad y coste</span></div></button>`:''}`;

function mvList(code){
  const ms=S.day.movs.filter(m=>m.codigo===code).sort((a,b)=>(a.ts||'').localeCompare(b.ts||''));const p=S.prods.get(code);

async function addMov(code){
  const sh=$('.sheet-bg');const p=S.prods.get(code);const v=parseNum($('#qty').value);const tipo=sh.dataset.tipo;
  if(!(v>0))return toast('Introduce una cantidad mayor que 0',true);
  // validaciones anti-error
  const advert=[];
  if(v>=1000)advert.push('cantidad muy grande');
  if(Math.round(v*1000)/1000!==v)advert.push('demasiados decimales');
  const cur0=agg(S.day.movs.filter(m=>m.codigo===code),[],S.prods).get(code),sacTot=(cur0?cur0.sacado:0)+v,h=sacHint(code);
  if(h){if(sacTot>h.hard&&(sacTot-h.pred)*cu(p)>=1)advert.push(`con esto llevas ${q3(sacTot)} ${ulp(p.unidad_conteo,sacTot)} sacadas hoy y para ${S.day.dia.pax} pax lo habitual es ~${q3(h.pred)} (tope normal ~${q3(h.hi)})`);}
  else{const hist=histMax(code);if(hist&&v>hist*2.5&&hist>0)advert.push(`más de 2,5× el máximo habitual (${q3(hist)} ${p.unidad_conteo}/día)`);}
  const dup=S.day.movs.find(m=>m.codigo===code&&!m.anulado&&m.tipo===tipo&&+m.cantidad===v&&Date.now()-new Date(m.ts).getTime()<20000);if(dup)advert.push('misma cantidad añadida hace segundos');
  if(advert.length&&!confirm(`⚠️ ${p.descripcion}\n${q3(v)} ${ulp(p.unidad_conteo,v)}: ${advert.join(', ')}.\n\n¿Es correcto?`))return;
  const m={id:nid(),fecha:S.fecha,codigo:code,tipo,cantidad:v,origen:'manual',usuario:S.user.nombre,ts:new Date().toISOString(),anulado:false};
  try{await DB.addMov(m);S.day.movs.push(m);$('#qty').value='';$('#qcost').innerHTML='&nbsp;';$('#mvlist').innerHTML=mvList(code);toast('Añadido: '+q3(v)+' '+ulp(p.unidad_conteo,v));}catch(e){toast(e.message,true);}
}
function histMax(code){if(!S.hist)return 0;const by=new Map();for(const m of S.hist.movs){if(m.anulado||m.codigo!==code||m.fecha===S.fecha)continue;by.set(m.fecha,(by.get(m.fecha)||0)+ +m.cantidad);}const a=[...by.values()];return a.length>=3?Math.max(...a):0;}

async function savePax(){

async function delDiaFlow(){

function cierreItems(){const map=agg(S.day.movs,S.day.cierres,S.prods);return[...map.values()].filter(r=>r.sacado>0).sort((a,b)=>(a.p?.descripcion||'').localeCompare(b.p?.descripcion||'','es'));}
function itemDone(r){return!!r.cierre;}
function vCierre(){
  const items=cierreItems();const done=items.filter(itemDone).length;const pax=S.day.dia?.pax;

function cierreCard(r){

function periodo(data){
  const dias=data.dias.filter(d=>d.pax>0&&data.movs.some(m=>m.fecha===d.fecha&&!m.anulado)).sort((a,b)=>a.fecha.localeCompare(b.fecha));const out=[];
  for(const d of dias){
    const mv=data.movs.filter(m=>m.fecha===d.fecha),ci=data.cierres.filter(c=>c.fecha===d.fecha);
    const map=agg(mv,ci,S.prods);const t=totales(map);
    out.push({fecha:d.fecha,pax:d.pax,estado:d.estado,...t,cpax:t.consumo/d.pax,map});
  }

}
function analiza(data,mode){

  const P0=periodo(data),P=mer?P0.map(d=>({...d,consumo:d.merma,cpax:d.merma/d.pax})):P0,pc=new Map(),fam=new Map();
  for(const d of P)for(const r of d.map.values()){
    const cat=(r.p&&r.p.categoria)||'Otros',qty=mer?r.M:r.consumo,val=qty*r.cu;
    let o=pc.get(r.codigo);if(!o){o={codigo:r.codigo,p:r.p,cat,uni:(r.p&&r.p.unidad_conteo)||'',cons:0,eur:0,mer:0,merE:0,per:[]};pc.set(r.codigo,o);}
    o.cons+=qty;o.eur+=val;o.mer+=r.M;o.merE+=r.M*r.cu;o.per.push({f:d.fecha,pax:d.pax,v:qty,cu:r.cu});
    let g=fam.get(cat);if(!g){g={cat,eur:0,merE:0,arts:new Set(),byDay:new Map()};fam.set(cat,g);}
    g.eur+=val;g.merE+=r.M*r.cu;g.arts.add(r.codigo);g.byDay.set(d.fecha,(g.byDay.get(d.fecha)||0)+val);

  const fams=[...fam.values()].sort((a,b)=>b.eur-a.eur);

const dpct=(a,b)=>b?(a-b)/Math.abs(b)*100:null;
function dl(a,b,good){

}
function chartBars(labels,series,fmt,sub){

function chartStack(labels,stacks,keys,colorOf,fmt){

// ---------- MODELO APRENDIDO (rango normal por artículo en función de los PAX) ----------
const qtl=(a,p)=>{if(!a.length)return 0;const v=[...a].sort((x,y)=>x-y),i=(v.length-1)*p,l=Math.floor(i),h=Math.ceil(i);return v[l]+(v[h]-v[l])*(i-l);};
const predict=(f,pax)=>Math.max(0,f.a+f.b*pax);
function fitLine(obs,key){
  // Ajuste robusto (mediana, insensible a días raros). Proporcional a los PAX; si hay base fija (p. ej. bandejas mínimas) usa recta Theil-Sen.
  const rm=median(obs.map(o=>o[key]/o.pax));
  const prop={a:0,b:rm,kind:'prop',sd:1.4826*median(obs.map(o=>Math.abs(o[key]-rm*o.pax)))};
  const px=obs.map(o=>o.pax);
  if(obs.length>=10&&Math.max(...px)/Math.max(1,Math.min(...px))>=1.25){
    const use=obs.slice(-120),sl=[];
    for(let i=0;i<use.length;i++)for(let j=i+1;j<use.length;j++){const dx=use[j].pax-use[i].pax;if(Math.abs(dx)>=5)sl.push((use[j][key]-use[i][key])/dx);}
    if(sl.length>=10){const b=median(sl),a=median(obs.map(o=>o[key]-b*o.pax)),sd=1.4826*median(obs.map(o=>Math.abs(o[key]-a-b*o.pax)));
      if(b>=0&&sd<0.85*prop.sd)return{a,b,sd,kind:'lin'};}
  }
  return prop;
}
function buildModel(data){
  const days=data.dias.filter(d=>d.estado==='cerrado'&&d.pax>0).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const mv=new Map(),ci=new Map(),grp=(M,x)=>{let a=M.get(x.fecha);if(!a)M.set(x.fecha,a=[]);a.push(x);};
  data.movs.forEach(m=>grp(mv,m));data.cierres.forEach(c=>grp(ci,c));
  const obs=new Map();
  for(const d of days){const map=agg(mv.get(d.fecha)||[],ci.get(d.fecha)||[],S.prods);
    for(const r of map.values()){if(!(r.sacado>0)||!r.cierre||S.avisos.get(d.fecha+'|'+r.codigo)==='error')continue;let a=obs.get(r.codigo);if(!a)obs.set(r.codigo,a=[]);a.push({f:d.fecha,pax:d.pax,cons:Math.max(0,r.consumo),sac:r.sacado,mer:r.M,cu:r.cu});}}
  const art=new Map();
  for(const[code,o0]of obs){const lp=o0[o0.length-1].cu,o=lp>0?o0.filter(x=>x.cu/lp>=0.55&&x.cu/lp<=1.8):o0;if(o.length<4)continue;
    art.set(code,{n:o.length,cons:fitLine(o,'cons'),sac:fitLine(o,'sac'),merR:median(o.map(x=>x.mer/x.sac)),consPaxP75:qtl(o.map(x=>x.cons/x.pax),0.75),sacPaxMed:median(o.map(x=>x.sac/x.pax)),cu:o[o.length-1].cu});}
  return{art,nDias:days.length,desde:days.length?days[0].fecha:null,hasta:days.length?days[days.length-1].fecha:null,avgPax:days.length?days.reduce((a,d)=>a+d.pax,0)/days.length:0};
}
async function loadAvisos(){try{const l=await DB.getAvisos();S.avisos=new Map(l.map(a=>[a.fecha+'|'+a.codigo,a.estado]));}catch(e){S.avisos=new Map();}}
async function loadBase(){
  if(S._baseP)return S._baseP;
  S._baseP=(async()=>{try{await loadAvisos();const data=await DB.getRango('2025-01-01',today());S.base={t:Date.now(),m:buildModel(data)};}catch(e){S.base={t:Date.now(),m:null};}finally{S._baseP=null;}return S.base;})();
  return S._baseP;
}
function sacHint(code){
  const pax=S.day.dia&&S.day.dia.pax,b=S.base&&S.base.m,m=b&&b.art.get(code);
  if(!m||m.n<8||!(pax>0))return null;
  const pred=predict(m.sac,pax),sc=Math.max(m.sac.sd,0.12*pred,0.05);
  return{pred,lo:Math.max(0,pred-2*sc),hi:pred+2*sc,hard:pred+3.5*sc,n:m.n,cons:predict(m.cons,pax)};
}

async function procesarExcel(file){
  const X=await loadXLSX();const wb=X.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=X.utils.sheet_to_json(ws,{defval:''});
  const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
  const get=(r,...ks)=>{for(const k of Object.keys(r)){if(ks.includes(norm(k)))return r[k];}return '';};
  const nuevos=[],cambios=[],iguales=[],errores=[];const seen=new Set();
  rows.forEach((r,i)=>{
    const desc=String(get(r,'descripcion','articulo','nombre','description')).trim();let cod=String(get(r,'codigo','partno','part','ref')).trim();
    const precio=parseNum(get(r,'preciocompra','precio','coste','price','supplierunitprice','sourceinvunitcost'));let factor=parseNum(get(r,'factor'));if(isNaN(factor))factor=1;
    if(!desc&&!cod)return;
    if(isNaN(precio)||precio<0)return errores.push(`Fila ${i+2}: precio no válido (${desc||cod})`);

    if(!cod){const f=prodList().find(p=>p.descripcion.toUpperCase()===desc.toUpperCase());cod=f?f.codigo:'MAN-'+(Date.now()+i).toString(36).toUpperCase();}
    if(seen.has(cod))return errores.push(`Fila ${i+2}: código repetido en el fichero (${cod})`);seen.add(cod);
    const uc=String(get(r,'unidadconteo','unidad')).trim().toUpperCase(),act=get(r,'activo');
    const row={codigo:cod,descripcion:(desc||S.prods.get(cod)?.descripcion||'').toUpperCase(),categoria:String(get(r,'categoria')).trim()||S.prods.get(cod)?.categoria||'Otros',unidad_compra:String(get(r,'unidadcompra','requom')).trim()||S.prods.get(cod)?.unidad_compra||'',precio_compra:precio,factor,unidad_conteo:uc||S.prods.get(cod)?.unidad_conteo||'UT',activo:act===''?(S.prods.get(cod)?.activo!==false):!(String(act)==='0'||String(act).toLowerCase()==='no'||act===false),revisar:String(get(r,'revisar','aviso')).trim()||(S.prods.get(cod)?.revisar||'')};
    const old=S.prods.get(cod);
    if(!old)nuevos.push(row);else if(Math.abs(old.precio_compra-precio)>1e-9||old.factor!==factor||old.unidad_conteo!==row.unidad_conteo||old.descripcion!==row.descripcion||old.activo!==row.activo||(old.revisar||'')!==row.revisar)cambios.push({old,row});else iguales.push(row);
  });
  const noEn=prodList().filter(p=>!seen.has(p.codigo)).length;
  const pc=cambios.filter(c=>Math.abs(cu(c.old)-c.row.precio_compra/c.row.factor)>1e-9);
  window._xl={nuevos,cambios};
  sheet(`<h3>Vista previa de la carga</h3><div class="muted">Nada se guarda hasta que confirmes. La carga nunca borra artículos.</div>
  <div class="kpis" style="margin-top:10px"><div class="kpi"><b>${nuevos.length}</b><span>artículos nuevos</span></div><div class="kpi"><b>${cambios.length}</b><span>con cambios (${pc.length} de precio)</span></div><div class="kpi"><b>${iguales.length}</b><span>sin cambios</span></div><div class="kpi"><b>${noEn}</b><span>no vienen en el fichero (se mantienen)</span></div></div>
  ${errores.length?`<div class="banner" style="background:#fde6e6;border-color:#f3b3b3"><b>${errores.length} filas con error (no se cargarán):</b><br>${errores.slice(0,8).map(esc).join('<br>')}</div>`:''}
  ${pc.length?`<b>Cambios de coste por unidad</b><table>${pc.slice(0,25).map(c=>{const a=cu(c.old),b=c.row.precio_compra/c.row.factor,d=a?(b-a)/a*100:0;return `<tr><td>${esc(c.row.descripcion.slice(0,34))}</td><td>${nf(a,3)}</td><td>${nf(b,3)}</td><td><span class="tag ${Math.abs(d)>25?'r':d>0?'w':'g'}">${d>0?'+':''}${nf(d,1)}%</span></td></tr>`}).join('')}</table>${pc.length>25?`<div class="muted">…y ${pc.length-25} más</div>`:''}`:''}
  <div class="row" style="margin-top:14px"><button class="btn ghost grow" data-act="closesheet">Cancelar</button><button class="btn grow" data-act="aplicarxl" ${nuevos.length+cambios.length?'':'disabled'}>Aplicar</button></div>`);

async function doExport(){

    if(!dias.length)return toast('No hay días con PAX'+(soloC?' y cerrados':'')+' en ese rango',true);
    const det=[['Fecha','Código','Artículo','Categoría','Unidad','Expuesto','Reposición','Aprovechamiento','Merma','Sacado','Consumo','Coste unidad (€)','Coste consumo (€)','Coste merma (€)','Coste bruto (€)','¿Reutiliza mañana?','Cerrado por']];
    const sumD=new Map();let r=2;
    for(const d of dias){
      const map=agg(data.movs.filter(m=>m.fecha===d.fecha),data.cierres.filter(c=>c.fecha===d.fecha),S.prods);
      const rows=[...map.values()].filter(x=>x.sacado>0||x.cierre).sort((a,b)=>(a.p?.descripcion||'').localeCompare(b.p?.descripcion||'','es'));
      let c=0,m=0,b=0;
      for(const x of rows){
        const R=r++;
        det.push([d.fecha,x.codigo,x.p?.descripcion||x.codigo,x.p?.categoria||'',x.p?.unidad_conteo||'',x.E,x.R,x.A,x.M,
          {t:'n',f:`F${R}+G${R}`,v:x.sacado},{t:'n',f:`F${R}+G${R}-H${R}-I${R}`,v:x.consumo},x.cu,
          {t:'n',f:`K${R}*L${R}`,v:x.consumo*x.cu},{t:'n',f:`I${R}*L${R}`,v:x.M*x.cu},{t:'n',f:`(F${R}+G${R}-H${R})*L${R}`,v:x.bruto*x.cu},x.reut?'Sí':(x.A>0?'No':''),d.cerrado_por||'']);
        c+=x.consumo*x.cu;m+=x.M*x.cu;b+=x.bruto*x.cu;
      }
      sumD.set(d.fecha,{c,m,b});
    }
    const last=r-1;
    const res=[['Fecha','PAX','Coste consumo (€)','Coste merma (€)','Coste bruto (€)','Coste/pax consumo (€)','Coste/pax bruto (€)','Merma % s/ bruto','Estado']];
    dias.forEach((d,i)=>{const R=i+2,s=sumD.get(d.fecha);res.push([d.fecha,d.pax,{t:'n',f:`SUMIFS(Detalle!$M$2:$M$${last},Detalle!$A$2:$A$${last},A${R})`,v:s.c},{t:'n',f:`SUMIFS(Detalle!$N$2:$N$${last},Detalle!$A$2:$A$${last},A${R})`,v:s.m},{t:'n',f:`SUMIFS(Detalle!$O$2:$O$${last},Detalle!$A$2:$A$${last},A${R})`,v:s.b},{t:'n',f:`C${R}/B${R}`,v:s.c/d.pax},{t:'n',f:`E${R}/B${R}`,v:s.b/d.pax},{t:'n',f:`IF(E${R}=0,0,D${R}/E${R})`,v:s.b?s.m/s.b:0},d.estado]);});
    const n=dias.length,L=n+1,T=n+2;const tc=[...sumD.values()].reduce((a,x)=>a+x.c,0),tm=[...sumD.values()].reduce((a,x)=>a+x.m,0),tb=[...sumD.values()].reduce((a,x)=>a+x.b,0),tp=dias.reduce((a,d)=>a+d.pax,0);
    res.push(['TOTAL / PONDERADO',{t:'n',f:`SUM(B2:B${L})`,v:tp},{t:'n',f:`SUM(C2:C${L})`,v:tc},{t:'n',f:`SUM(D2:D${L})`,v:tm},{t:'n',f:`SUM(E2:E${L})`,v:tb},{t:'n',f:`C${T}/B${T}`,v:tc/tp},{t:'n',f:`E${T}/B${T}`,v:tb/tp},{t:'n',f:`IF(E${T}=0,0,D${T}/E${T})`,v:tb?tm/tb:0},'']);
    const simple=dias.reduce((a,d)=>a+sumD.get(d.fecha).c/d.pax,0)/n;
    res.push(['MEDIA SIMPLE (por día)','',"","","",{t:'n',f:`AVERAGE(F2:F${L})`,v:simple},{t:'n',f:`AVERAGE(G2:G${L})`,v:dias.reduce((a,d)=>a+sumD.get(d.fecha).b/d.pax,0)/n},'','']);
    res.push([]);res.push(['Criterio: Consumo = Expuesto + Reposición − Aprovechamiento − Merma. Coste bruto = Expuesto + Reposición − Aprovechamiento (incluye el coste de la merma). Precio congelado al cerrar cada artículo.']);
    const set=new Set(dias.map(d=>d.fecha));
    const mov=[['Fecha','Hora','Código','Artículo','Tipo','Cantidad','Origen','Usuario','Anulado','Anulado por']];
    data.movs.filter(m=>set.has(m.fecha)).sort((a,b)=>(a.ts||'').localeCompare(b.ts||'')).forEach(m=>mov.push([m.fecha,m.ts?new Date(m.ts).toLocaleTimeString('es-ES'):'',m.codigo,S.prods.get(m.codigo)?.descripcion||'',m.tipo,+m.cantidad,m.origen,m.usuario,m.anulado?'SÍ':'',m.anulado_por||'']));
    const wb=X.utils.book_new();
    const mk=(a,w)=>{const ws=X.utils.aoa_to_sheet(a);ws['!cols']=w.map(x=>({wch:x}));return ws;};
    X.utils.book_append_sheet(wb,mk(res,[22,8,18,16,16,20,18,16,10]),'Resumen');
    const wd=mk(det,[11,17,46,22,8,10,11,15,8,9,9,12,14,13,13,12,12]);wd['!autofilter']={ref:`A1:Q${last}`};wd['!freeze']={xSplit:0,ySplit:1};
    X.utils.book_append_sheet(wb,wd,'Detalle');X.utils.book_append_sheet(wb,mk(mov,[11,9,17,44,11,9,10,14,8,12]),'Movimientos');
    X.writeFile(wb,`Escandallo_desayunos_${dias[0].fecha}_${dias[n-1].fecha}.xlsx`);toast('Excel generado');
  }catch(e){toast(e.message,true);}
}

/* ============================================================
   EVENTOS
============================================================ */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  try{
  if(a==='cambiopin'){await savePin();} else if(a==='login'){const n=$('#lg_n').value,p=$('#lg_p').value;if(!n||!p)return toast('Nombre y PIN',true);try{S.user=await DB.login(n,p);if(!CLOUD)sessionStorage.setItem('kd_user',JSON.stringify(S.user));await afterLogin();}catch(er){toast(er.message,true);}}
  else if(a==='logout'){sessionStorage.removeItem('kd_user');location.reload();}
  else if(a==='tab'){S.tab=b.dataset.t;if(S.tab==='analisis'||S.tab==='control')S.an.data=null;render();window.scrollTo(0,0);}
  else if(a==='vista'){S.vista=b.dataset.v;render();}
  else if(a==='cat'){S.cat=b.dataset.c;render();}
  else if(a==='open')openItem(b.dataset.c);
  else if(a==='tipo'){const sh=$('.sheet-bg');sh.dataset.tipo=b.dataset.t;sh.querySelectorAll('[data-act=tipo]').forEach(x=>x.classList.toggle('on',x===b));$('#qty').focus();}
  else if(a==='addmov')addMov(b.dataset.c);
  else if(a==='anular'){if(confirm('¿Anular esta cantidad? Quedará registrada como anulada.')){await DB.anularMov(b.dataset.id,S.user.nombre);const m=S.day.movs.find(x=>x.id===b.dataset.id);m.anulado=true;m.anulado_por=S.user.nombre;$('#mvlist').innerHTML=mvList(b.dataset.c);}}
  else if(a==='closesheet'){closeSheet();render(true);}
  else if(a==='nuevo')openNuevo();
  else if(a==='savenuevo')saveNuevo();
  else if(a==='pax')openPax();
  else if(a==='savepax')await savePax();
  else if(a==='deldia')await delDiaFlow();
  else if(a==='adminpax'){S.fecha=b.dataset.f;S.cierreEdit={};await loadDay(true);openPax();}
  else if(a==='admindel'){S.fecha=b.dataset.f;S.cierreEdit={};await loadDay(true);await delDiaFlow();}
  else if(a==='anmode'){S.an.mode=b.dataset.m;render(true);}
  else if(a==='arrastre'){const items=S.prev.cierres.filter(c=>c.reutiliza&&+c.aprovechamiento>0);for(const c of items){const m={id:nid(),fecha:S.fecha,codigo:c.codigo,tipo:'expuesto',cantidad:+c.aprovechamiento,origen:'arrastre',usuario:S.user.nombre,ts:new Date().toISOString(),anulado:false};await DB.addMov(m);S.day.movs.push(m);}S.vista='usados';render();toast(items.length+' sobrantes cargados como expuesto');}
  else if(a==='reut'){const c=b.dataset.c;S.cierreEdit[c]={...(S.cierreEdit[c]||{}),R:b.dataset.v};syncEdit(c);render(true);}
  else if(a==='todoconsumido'){confCierre(b.dataset.c,true);}
  else if(a==='confcierre'){confCierre(b.dataset.c,false);}
  else if(a==='cedit'){const r=agg(S.day.movs,S.day.cierres,S.prods).get(b.dataset.c);S.cierreEdit[b.dataset.c]={A:String(r.A),M:String(r.M),R:r.A>0?(r.reut?'si':'no'):''};render(true);}
  else if(a==='cerrardia'){const items=cierreItems();const tot=totales(agg(S.day.movs,S.day.cierres,S.prods));const pax=S.day.dia.pax;if(confirm(`Cerrar ${fechaLarga(S.fecha)}?\n\nPAX: ${pax}\nCoste consumo: ${eur(tot.consumo)}\nCoste/pax: ${eur(tot.consumo/pax)}\nMerma: ${eur(tot.merma)}\n\nTras cerrar no se podrá modificar (solo un admin puede reabrir).`)){await DB.cerrarDia(S.fecha,S.user.nombre);S.base=null;loadBase().catch(()=>{});await loadDay(true);render();toast('Día cerrado ✔');}}
  else if(a==='reabrir'){if(confirm('¿Reabrir el día?')){await DB.reabrirDia(S.fecha);S.base=null;loadBase().catch(()=>{});await loadDay(true);render();}}
    else if(a==='anload'||a==='anq'||a==='ancmp'){
    const g=id=>{const e=$('#'+id);return e&&e.value?e.value:null;};
    if(g('an_d'))S.an.desde=g('an_d');if(g('an_h'))S.an.hasta=g('an_h');if(g('an_cd'))S.an.cdesde=g('an_cd');if(g('an_ch'))S.an.chasta=g('an_ch');
    if(a==='anq'){const q=b.dataset.q,t=today(),d=new Date(t+'T12:00:00');
      if(q==='7'){S.an.desde=addDays(t,-6);S.an.hasta=t;}
      else if(q==='30'){S.an.desde=addDays(t,-29);S.an.hasta=t;}
      else if(q==='mes'){S.an.desde=t.slice(0,8)+'01';S.an.hasta=t;}
      else if(q==='mesant'){S.an.desde=isoDate(new Date(d.getFullYear(),d.getMonth()-1,1,12));S.an.hasta=isoDate(new Date(d.getFullYear(),d.getMonth(),0,12));}
      else{S.an.desde='2026-01-01';S.an.hasta=t;}}
    if(a==='ancmp'){S.an.cmp=b.dataset.c;if(S.an.cmp==='custom'&&!S.an.cdesde){const n=diffDays(S.an.desde,S.an.hasta)+1;S.an.chasta=addDays(S.an.desde,-1);S.an.cdesde=addDays(S.an.desde,-n);}}
    if(S.an.desde>S.an.hasta||(S.an.cmp==='custom'&&S.an.cdesde>S.an.chasta))return toast('Fechas no válidas',true);
    S.an.data=null;render();}
  else if(a==='irdia'){S.fecha=b.dataset.f;S.cierreEdit={};S.tab='cierre';await loadDay();render();window.scrollTo(0,0);}
  else if(a==='anmet'){S.an.met=b.dataset.m;S.an.vw='tot';render(true);}
  else if(a==='anvw'){S.an.vw='fam';render(true);}
  else if(a==='anfam'){const f=b.dataset.f;S.an.fam=(!f||S.an.fam===f)?'Todas':f;render(true);}
  else if(a==='annrk'){S.an.nrk=+b.dataset.n;render(true);}
  else if(a==='anuni'){S.an.uni=b.dataset.u;render(true);}
  else if(a==='anart'){let c=b.dataset.c;if(!c){const v=(($('#an_art')||{}).value||'').trim().toLowerCase();const L=[...analiza(S.an.data,S.an.mode).pc.values()];const o=L.find(x=>x.p&&x.p.descripcion.toLowerCase()===v)||(v&&L.find(x=>x.p&&x.p.descripcion.toLowerCase().includes(v)));if(!o)return toast('Artículo no encontrado en el periodo',true);c=o.codigo;}S.an.art=c;render(true);setTimeout(()=>{const e=$('#anart');if(e)e.scrollIntoView({behavior:'smooth'});},60);}
  else if(a==='aviso'){const f=b.dataset.f,c=b.dataset.c,st=b.dataset.s;await DB.setAviso({fecha:f,codigo:c,estado:st,usuario:S.user.nombre,ts:new Date().toISOString()});S.avisos.set(f+'|'+c,st);if(st==='error'){S.base=null;loadBase().then(()=>render(true));}render(true);toast(st==='normal'?'Marcado como normal: no volverá a avisar':'Marcado como error: se excluye del aprendizaje');}
  else if(a==='imphist')$('#hjson').click();
  else if(a==='aplicarhist')await aplicarHist();
  else if(a==='cargaxls')$('#xls').click();
  else if(a==='bajaxls')bajaXLS();
  else if(a==='crev'){S.cfilt=S.cfilt==='rev'?'':'rev';render();}
  else if(a==='editp')openEditP(b.dataset.c);
  else if(a==='altacat')openEditP('');
  else if(a==='savep')saveP(b.dataset.c);
  else if(a==='aplicarxl')aplicarXL();
  else if(a==='doexport')doExport();
  }catch(er){toast(er.message||String(er),true);}
});
function syncEdit(c){const card=document.querySelector(`[data-cc="${CSS.escape(c)}"]`);if(!card)return;const ed=S.cierreEdit[c]||{};card.querySelectorAll('input[data-f]').forEach(i=>ed[i.dataset.f]=i.value);S.cierreEdit[c]=ed;}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;S._focusQ=true;clearTimeout(S._qt);S._qt=setTimeout(render,120);}
  else if(t.id==='n_p'){hintNuevo();}
  else if(t.id==='cq'){S.cq=t.value;clearTimeout(S._qt);S._qt=setTimeout(()=>{render();const x=$('#cq');x.focus();x.setSelectionRange(x.value.length,x.value.length);},150);}
  else if(t.dataset&&t.dataset.f){const card=t.closest('[data-cc]');const c=card.dataset.cc;const ed=S.cierreEdit[c]||{};ed[t.dataset.f]=t.value;S.cierreEdit[c]=ed;S.cierreEdit._typing=true;const a=parseNum(ed.A);const rr=document.getElementById('reut_'+c);if(rr)rr.classList.toggle('hidden',!(a>0));}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='n_u'||t.id==='n_p'){hintNuevo();}
  else if(t.id==='fecha'){S.fecha=t.value||today();S.cierreEdit={};await loadDay();render();}
  else if(t.id==='hjson'&&t.files[0]){try{await procesarHist(t.files[0]);}catch(er){toast('Fichero no válido: '+er.message,true);}t.value='';}
  else if(t.id==='xls'&&t.files[0]){try{await procesarExcel(t.files[0]);}catch(er){toast(er.message,true);}t.value='';}
});
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.f)setTimeout(()=>{S.cierreEdit._typing=false;},300);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#lg_p')&&document.activeElement.id==='lg_p')$('[data-act=login]').click();});
boot();
</script>
